<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Costos | BOA FX</title>
  <style>
    :root {
      --rojo: #e50914;
      --blanco: #ffffff;
      --gris: #1a1a1a;
      --gris-claro: #2b2b2b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background-color: #000;
      color: var(--blanco);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }

    img.logo {
      width: 180px;
      max-width: 60%;
      margin-bottom: 25px;
      animation: fadeIn 1s ease-out;
    }

    h1 {
      color: var(--rojo);
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .panel {
      background-color: var(--gris);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--blanco);
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--rojo);
      background-color: var(--gris-claro);
      color: var(--blanco);
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: var(--blanco);
    }

    button {
      width: 100%;
      background-color: var(--rojo);
      color: var(--blanco);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #ff1a1a;
      transform: scale(1.02);
    }

    .resultado {
      margin-top: 25px;
      background-color: var(--gris-claro);
      border-left: 4px solid var(--rojo);
      border-radius: 8px;
      padding: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .nota {
      margin-top: 12px;
      font-size: 12px;
      color: #b8b8b8;
      line-height: 1.4;
    }

    .tiny {
      margin-top: 10px;
      font-size: 11px;
      color: #9a9a9a;
      line-height: 1.35;
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 10px;
    }

    .tbl th, .tbl td {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      vertical-align: top;
    }

    .tbl th {
      font-size: 12px;
      color: #d8d8d8;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .tbl td {
      font-size: 13px;
      color: #f1f1f1;
    }

    .tbl .muted {
      color: #c7c7c7;
      font-size: 12px;
    }

    .summary {
      margin-top: 14px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(229, 9, 20, 0.35);
      border-radius: 12px;
      padding: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
    }

    .row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .k {
      color: #dcdcdc;
      font-size: 13px;
    }

    .v {
      font-size: 13px;
      font-weight: 600;
    }

    .bigPrice {
      margin-top: 8px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(229, 9, 20, 0.12);
      border: 1px solid rgba(229, 9, 20, 0.45);
    }

    .bigPrice .label {
      font-size: 12px;
      color: #ffd0d3;
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    .bigPrice .amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--rojo);
      line-height: 1.1;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.25rem; }
      .panel { padding: 20px; }
      .bigPrice .amount { font-size: 20px; }
    }
  </style>
</head>
<body>
  <img src="logo boa fx.png" alt="BOA FX" class="logo" />
  <h1>Calculadora de Costos</h1>

  <div class="panel">
    <label for="porParte">
      ¿Cuántos gramos usaste por parte? (A, B y Slacker)
      <span style="display:block; font-size:12px; color:#c9c9c9; margin-top:4px;">
        Ejemplo: si usaste 32g de A + 32g de B + 32g de Slacker, escribe <b>32</b>.
      </span>
    </label>
    <input id="porParte" type="number" min="0" step="0.01" placeholder="Ejemplo: 32" />

    <button onclick="calcularCosto()">Calcular</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <footer>© 2025 BOA FX — Cálculo estimado de materiales</footer>

  <script>
    // ---- SONIDO BEEP DIGITAL ----
    function beep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'square';
        osc.frequency.value = 800;
        gain.gain.value = 0.08;

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, 120);
      } catch (e) {}
    }

    function calcularCosto() {
      beep();

      // ====== CONFIG ======
      const MARGEN_GANANCIA = 0.45; // 45%

      // Silicona A+B (kit completo)
      const SILICONA_COSTO_TOTAL = 840;   // MXN
      const SILICONA_PESO_TOTAL_G = 910;  // 0.91 kg = 910 g
      const COSTO_SILICONA_G = SILICONA_COSTO_TOTAL / SILICONA_PESO_TOTAL_G;

      // Slacker
      const SLACKER_COSTO_TOTAL = 590;    // MXN
      const SLACKER_PESO_TOTAL_G = 490;   // g
      const COSTO_SLACKER_G = SLACKER_COSTO_TOTAL / SLACKER_PESO_TOTAL_G;

      // Otros materiales (como tu versión original)
      const COSTO_ULTRACAL_KG = 36.08;
      const COSTO_GLATZAN_ML = 3.16;
      const ULTRACAL_CANTIDAD_KG = 1.5;
      const GLATZAN_CANTIDAD_ML = 5.0;

      // ====== INPUT ======
      const porParte = parseFloat(document.getElementById("porParte").value);
      const resultado = document.getElementById("resultado");

      if (isNaN(porParte) || porParte <= 0) {
        resultado.textContent = "⚠️ Ingresa un número válido (en gramos). Ejemplo: 32";
        return;
      }

      // ====== CANTIDADES DERIVADAS ======
      // Si escribes 32, se asume:
      // A = 32g, B = 32g, Slacker = 32g
      const A_g = porParte;
      const B_g = porParte;
      const slacker_g = porParte;

      // Silicona total consumida (A+B)
      const siliconaTotal_g = A_g + B_g;

      // ====== COSTOS ======
      const costoSilicona = siliconaTotal_g * COSTO_SILICONA_G;
      const costoSlacker = slacker_g * COSTO_SLACKER_G;

      const costoUltracal = ULTRACAL_CANTIDAD_KG * COSTO_ULTRACAL_KG;
      const costoGlatzan = GLATZAN_CANTIDAD_ML * COSTO_GLATZAN_ML;

      const costoTotal = costoSilicona + costoSlacker + costoUltracal + costoGlatzan;
      const precioSugerido = costoTotal * (1 + MARGEN_GANANCIA);

      // formato MXN
      const mxn = (n) => n.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });

      resultado.innerHTML = `
        <div class="nota">
          <b>Nota:</b> El precio sugerido considera el uso de materiales y un margen para contemplar
          consumibles (embalaje, guantes, herramientas), desgaste, errores, y tiempo de trabajo.
        </div>

        <table class="tbl">
          <thead>
            <tr>
              <th>Material</th>
              <th>Cantidad</th>
              <th>Costo</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Silicona A/B <div class="muted">(${mxn(COSTO_SILICONA_G)} / g)</div></td>
              <td>${siliconaTotal_g.toFixed(2)} g <div class="muted">A: ${A_g.toFixed(2)} g · B: ${B_g.toFixed(2)} g</div></td>
              <td>${mxn(costoSilicona)}</td>
            </tr>
            <tr>
              <td>Slacker <div class="muted">(${mxn(COSTO_SLACKER_G)} / g)</div></td>
              <td>${slacker_g.toFixed(2)} g</td>
              <td>${mxn(costoSlacker)}</td>
            </tr>
            <tr>
              <td>Ultracal (Molde)</td>
              <td>${ULTRACAL_CANTIDAD_KG.toFixed(1)} kg</td>
              <td>${mxn(costoUltracal)}</td>
            </tr>
            <tr>
              <td>Glatzan</td>
              <td>${GLATZAN_CANTIDAD_ML.toFixed(1)} ml</td>
              <td>${mxn(costoGlatzan)}</td>
            </tr>
          </tbody>
        </table>

        <div class="summary">
          <div class="row">
            <div class="k">Precio inicial (costo real)</div>
            <div class="v">${mxn(costoTotal)}</div>
          </div>

          <div class="row">
            <div class="k">Margen aplicado</div>
            <div class="v">${(MARGEN_GANANCIA * 100).toFixed(0)}%</div>
          </div>

          <div class="bigPrice">
            <div class="label">Precio sugerido de venta</div>
            <div class="amount">${mxn(precioSugerido)}</div>
          </div>

          <div class="tiny">
            Vender a este precio o menos resultará en una pérdida neta de su tiempo y esfuerzo. No acepte menos de lo que merece
          </div>
        </div>
      `;
    }

    // Enter para calcular
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calcularCosto();
    });
  </script>
</body>
</html>

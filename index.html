<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora BOA FX</title>

<style>
:root{
  --rojo:#e50914;
  --gris:#1a1a1a;
  --gris2:#2b2b2b;
  --blanco:#ffffff;
}

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  background:#000;
  color:var(--blanco);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 15px;
  min-height:100vh;
}

img.logo{
  width:180px;
  max-width:60%;
  margin-bottom:25px;
  animation:fadeIn 1s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}

.panel{
  background:var(--gris);
  width:100%;
  max-width:480px;
  border-radius:14px;
  padding:22px;
  box-shadow:0 0 20px rgba(229,9,20,.35);
}

.tabs{
  display:flex;
  margin-bottom:18px;
  border-radius:10px;
  overflow:hidden;
}

.tab{
  flex:1;
  padding:10px;
  text-align:center;
  cursor:pointer;
  background:#111;
  font-size:13px;
  font-weight:600;
  color:#ccc;
}

.tab.active{
  background:var(--rojo);
  color:#fff;
}

.section{display:none;}
.section.active{display:block;}

label{
  display:block;
  margin-bottom:6px;
  font-weight:500;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--rojo);
  background:var(--gris2);
  color:#fff;
  margin-bottom:14px;
}

button{
  width:100%;
  background:var(--rojo);
  border:none;
  color:#fff;
  padding:14px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.resultado{
  margin-top:20px;
  background:var(--gris2);
  padding:16px;
  border-left:4px solid var(--rojo);
  border-radius:10px;
  font-size:13px;
}

.tbl{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.tbl th,.tbl td{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  text-align:left;
}

.big{
  margin-top:12px;
  background:rgba(229,9,20,.15);
  border:1px solid rgba(229,9,20,.4);
  padding:12px;
  border-radius:10px;
}

.big .price{
  font-size:22px;
  font-weight:800;
  color:var(--rojo);
}

.tiny{
  font-size:11px;
  color:#aaa;
  margin-top:8px;
}

.note{
  font-size:12px;
  color:#ccc;
  margin-bottom:10px;
}

footer{
  margin-top:30px;
  font-size:12px;
  color:#777;
  text-align:center;
}
</style>
</head>

<body>

<img src="logo boa fx.png" alt="BOA FX" class="logo">

<div class="panel">

  <div class="tabs">
    <div class="tab active" onclick="showTab(0)">Por Ultracal</div>
    <div class="tab" onclick="showTab(1)">Por material usado</div>
  </div>

  <!-- TAB ULTRACAL -->
  <div class="section active">
    <label>Peso del molde de Ultracal (g)</label>
    <input id="ultracal" placeholder="Coloca aquí">
    <button onclick="calcUltracal()">Calcular</button>
  </div>

  <!-- TAB MANUAL -->
  <div class="section">
    <div class="note">
      Recomendado cuando el molde se repite o se utiliza material extra.
    </div>

    <label>Gramos usados de Silicona A</label>
    <input id="a">

    <label>Gramos usados de Silicona B</label>
    <input id="b">

    <label>Gramos usados de Slacker</label>
    <input id="s">

    <button onclick="calcManual()">Calcular</button>
  </div>

  <div id="res" class="resultado"></div>
</div>

<footer>
  © 2025 BOA FX — Cálculo estimado de materiales
</footer>

<script>
const MARGEN = 0.45;

// costos por gramo
const SIL_G = 840 / 910;   // silicona A+B
const SL_G  = 590 / 490;   // slacker
const GLATZAN = 3.16 * 5;  // uso fijo

const mxn = n => n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});

function showTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.section').forEach((s,j)=>s.classList.toggle('active',i===j));
  document.getElementById('res').innerHTML='';
}

function render(cost){
  const venta = cost * (1 + MARGEN);
  return `
    <table class="tbl">
      <tr><th>Concepto</th><th>Monto</th></tr>
      <tr><td>Costo real</td><td>${mxn(cost)}</td></tr>
      <tr><td>Margen aplicado</td><td>${(MARGEN*100).toFixed(0)}%</td></tr>
    </table>

    <div class="big">
      <div>Precio sugerido de venta</div>
      <div class="price">${mxn(venta)}</div>
    </div>

    <div class="tiny">
      Vender a este precio o menos resultará en una pérdida neta de su tiempo y esfuerzo. No acepte menos de lo que merece
    </div>
  `;
}

function calcUltracal(){
  const u = parseFloat(ultracal.value);
  if(!u || u <= 0) return;

  const total = u * 0.7;
  const part = total / 3;

  const cost =
    ((part * 2) * SIL_G) +
    (part * SL_G) +
    GLATZAN;

  res.innerHTML = render(cost);
}

function calcManual(){
  const A = parseFloat(a.value) || 0;
  const B = parseFloat(b.value) || 0;
  const S = parseFloat(s.value) || 0;

  const cost =
    ((A + B) * SIL_G) +
    (S * SL_G) +
    GLATZAN;

  res.innerHTML = render(cost);
}
</script>

</body>
</html>

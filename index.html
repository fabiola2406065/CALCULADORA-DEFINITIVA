<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora BOA FX</title>

<style>
:root{
  --rojo:#e50914;
  --gris:#1a1a1a;
  --gris2:#2b2b2b;
  --blanco:#ffffff;
}

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  background:#000;
  color:var(--blanco);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 15px;
  min-height:100vh;
}

img.logo{
  width:180px;
  max-width:60%;
  margin-bottom:25px;
  animation:fadeIn 1s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}

.panel{
  background:var(--gris);
  width:100%;
  max-width:480px;
  border-radius:14px;
  padding:22px;
  box-shadow:0 0 20px rgba(229,9,20,.35);
}

.tabs{
  display:flex;
  margin-bottom:18px;
  border-radius:10px;
  overflow:hidden;
}

.tab{
  flex:1;
  padding:10px;
  text-align:center;
  cursor:pointer;
  background:#111;
  font-size:13px;
  font-weight:600;
  color:#ccc;
}

.tab.active{
  background:var(--rojo);
  color:#fff;
}

.section{display:none;}
.section.active{display:block;}

label{
  display:block;
  margin-bottom:6px;
  font-weight:500;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--rojo);
  background:var(--gris2);
  color:#fff;
  margin-bottom:14px;
}

button{
  width:100%;
  background:var(--rojo);
  border:none;
  color:#fff;
  padding:14px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.resultado{
  margin-top:20px;
  background:var(--gris2);
  padding:16px;
  border-left:4px solid var(--rojo);
  border-radius:10px;
  font-size:13px;
}

.tbl{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.tbl th,.tbl td{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  text-align:left;
}

.big{
  margin-top:12px;
  background:rgba(229,9,20,.15);
  border:1px solid rgba(229,9,20,.4);
  padding:12px;
  border-radius:10px;
}

.big .price{
  font-size:22px;
  font-weight:800;
  color:var(--rojo);
}

.tiny{
  font-size:11px;
  color:#aaa;
  margin-top:8px;
}

.note{
  font-size:12px;
  color:#ccc;
  margin-bottom:10px;
}

.mix{
  margin-top:12px;
  font-size:12px;
  color:#cfcfcf;
  line-height:1.45;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.08);
  padding:10px;
  border-radius:10px;
}

footer{
  margin-top:30px;
  font-size:12px;
  color:#777;
  text-align:center;
}
</style>
</head>

<body>

<img src="logo boa fx.png" alt="BOA FX" class="logo">

<div class="panel">

  <div class="tabs">
    <div class="tab active" onclick="showTab(0)">Por Ultracal</div>
    <div class="tab" onclick="showTab(1)">Por material usado</div>
  </div>

  <!-- TAB ULTRACAL -->
  <div class="section active">
    <label>Peso del molde de Ultracal (g)</label>
    <input id="ultracal" placeholder="Coloca aquí">
    <button onclick="calcUltracal()">Calcular</button>
  </div>

  <!-- TAB MANUAL -->
  <div class="section">
    <div class="note">
      Recomendado cuando el molde se repite o se utiliza material extra.
    </div>

    <label>Gramos usados de Silicona A</label>
    <input id="a" placeholder="Coloca aquí">

    <label>Gramos usados de Silicona B</label>
    <input id="b" placeholder="Coloca aquí">

    <label>Gramos usados de Slacker</label>
    <input id="s" placeholder="Coloca aquí">

    <button onclick="calcManual()">Calcular</button>
  </div>

  <div id="res" class="resultado"></div>
</div>

<footer>
  © 2025 BOA FX — Cálculo estimado de materiales
</footer>

<script>
const MARGEN = 0.60; // 60%

// costos por gramo
const SIL_G = 840 / 910;   // silicona A+B
const SL_G  = 590 / 490;   // slacker
const GLATZAN = 3.16 * 5;  // uso fijo

const mxn = n => n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const f2 = n => Number(n).toFixed(2);

function showTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.section').forEach((s,j)=>s.classList.toggle('active',i===j));
  document.getElementById('res').innerHTML='';
}

function render({cost, mixHtml, breakdownHtml}){
  const venta = cost * (1 + MARGEN);
  return `
    <div class="note">
      El precio sugerido considera embalaje, consumibles, desgaste, posibles errores y tiempo de trabajo.
    </div>

    ${breakdownHtml}

    <table class="tbl">
      <tr><th>Concepto</th><th>Monto</th></tr>
      <tr><td>Costo real</td><td>${mxn(cost)}</td></tr>
      <tr><td>Margen aplicado</td><td>${(MARGEN*100).toFixed(0)}%</td></tr>
    </table>

    <div class="big">
      <div>Precio sugerido de venta</div>
      <div class="price">${mxn(venta)}</div>
    </div>

    <div class="mix">
      <b>Cálculo de mezcla:</b><br>
      ${mixHtml}
    </div>

    <div class="tiny">
      Vender a este precio o menos resultará en una pérdida neta de su tiempo y esfuerzo. No acepte menos de lo que merece
    </div>
  `;
}

function calcUltracal(){
  const u = parseFloat(ultracal.value);
  if(!u || u <= 0){
    res.innerHTML = "⚠️ Ingresa un número válido (en gramos).";
    return;
  }

  // Tu receta: total = ultracal*0.7 ; por parte = total/3
  const total = u * 0.7;
  const part = total / 3;

  const A = part;
  const B = part;
  const S = part;

  const cost =
    ((A + B) * SIL_G) +
    (S * SL_G) +
    GLATZAN;

  const breakdownHtml = `
    <table class="tbl">
      <tr><th>Material</th><th>Cantidad</th><th>Costo</th></tr>
      <tr>
        <td>Silicona A/B</td>
        <td>${f2(A+B)} g <span style="color:#bbb;font-size:12px;">(A: ${f2(A)} · B: ${f2(B)})</span></td>
        <td>${mxn((A+B)*SIL_G)}</td>
      </tr>
      <tr>
        <td>Slacker</td>
        <td>${f2(S)} g</td>
        <td>${mxn(S*SL_G)}</td>
      </tr>
      <tr>
        <td>Glatzan</td>
        <td>5.0 ml</td>
        <td>${mxn(GLATZAN)}</td>
      </tr>
    </table>
  `;

  const mixHtml = `
    Molde Ultracal: ${f2(u)} g<br>
    Total (Silicona + Slacker) = ${f2(u)} × 0.7 = ${f2(total)} g<br>
    Por parte (A, B, Slacker) = ${f2(total)} ÷ 3 = ${f2(part)} g c/u
  `;

  res.innerHTML = render({cost, mixHtml, breakdownHtml});
}

function calcManual(){
  const A = parseFloat(a.value);
  const B = parseFloat(b.value);
  const S = parseFloat(s.value);

  const Aok = !isNaN(A) && A >= 0;
  const Bok = !isNaN(B) && B >= 0;
  const Sok = !isNaN(S) && S >= 0;

  if(!Aok || !Bok || !Sok || (A===0 && B===0 && S===0)){
    res.innerHTML = "⚠️ Ingresa valores válidos (en gramos).";
    return;
  }

  const total = (A + B + S);
  const partAvg = total / 3;

  const cost =
    ((A + B) * SIL_G) +
    (S * SL_G) +
    GLATZAN;

  const breakdownHtml = `
    <table class="tbl">
      <tr><th>Material</th><th>Cantidad</th><th>Costo</th></tr>
      <tr>
        <td>Silicona A/B</td>
        <td>${f2(A+B)} g <span style="color:#bbb;font-size:12px;">(A: ${f2(A)} · B: ${f2(B)})</span></td>
        <td>${mxn((A+B)*SIL_G)}</td>
      </tr>
      <tr>
        <td>Slacker</td>
        <td>${f2(S)} g</td>
        <td>${mxn(S*SL_G)}</td>
      </tr>
      <tr>
        <td>Glatzan</td>
        <td>5.0 ml</td>
        <td>${mxn(GLATZAN)}</td>
      </tr>
    </table>
  `;

  const mixHtml = `
    Total (Silicona + Slacker) = ${f2(A)} + ${f2(B)} + ${f2(S)} = ${f2(total)} g<br>
    Por parte (A, B, Slacker) = ${f2(total)} ÷ 3 = ${f2(partAvg)} g c/u
  `;

  res.innerHTML = render({cost, mixHtml, breakdownHtml});
}

// Enter para calcular
document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const ultracalTabActive = document.querySelectorAll('.section')[0].classList.contains('active');
    if(ultracalTabActive) calcUltracal();
    else calcManual();
  }
});
</script>

</body>
</html>

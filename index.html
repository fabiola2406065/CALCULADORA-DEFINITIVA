<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Costos | BOA FX</title>
  <style>
    :root {
      --rojo: #e50914;
      --blanco: #ffffff;
      --gris: #1a1a1a;
      --gris-claro: #2b2b2b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background-color: #000;
      color: var(--blanco);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }

    img.logo {
      width: 180px;
      max-width: 60%;
      margin-bottom: 25px;
      animation: fadeIn 1s ease-out;
    }

    h1 {
      color: var(--rojo);
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .panel {
      background-color: var(--gris);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--blanco);
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--rojo);
      background-color: var(--gris-claro);
      color: var(--blanco);
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: var(--blanco);
    }

    button {
      width: 100%;
      background-color: var(--rojo);
      color: var(--blanco);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #ff1a1a;
      transform: scale(1.02);
    }

    .resultado {
      margin-top: 25px;
      background-color: var(--gris-claro);
      border-left: 4px solid var(--rojo);
      border-radius: 8px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .resultado b {
      color: var(--rojo);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.3rem; }
      .panel { padding: 20px; }
      button { font-size: 15px; }
    }
  </style>
</head>
<body>
  <img src="logo boa fx.png" alt="BOA FX" class="logo" />
  <h1>Calculadora de Costos</h1>

  <div class="panel">
    <label for="silicona">¿Cuánta silicona A/B usaste? (en gramos)</label>
    <input id="silicona" type="number" min="0" step="0.01" placeholder="Ejemplo: 250" />

    <label for="slacker">¿Cuánto Slacker usaste? (en gramos)</label>
    <input id="slacker" type="number" min="0" step="0.01" placeholder="Ejemplo: 20" />

    <button onclick="calcularCosto()">Calcular</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <footer>© 2025 BOA FX — Cálculo estimado de materiales</footer>

  <script>
    // ---- SONIDO BEEP DIGITAL ----
    function beep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'square';
        osc.frequency.value = 800;
        gain.gain.value = 0.08;

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, 120);
      } catch (e) {
        // si el navegador bloquea audio, no hacemos nada
      }
    }

    // ---- CÁLCULO ----
    function calcularCosto() {
      beep();

      // Tus costos reales (para sacar precio por gramo)
      const SILICONA_COSTO_TOTAL = 840;   // MXN
      const SILICONA_PESO_TOTAL_G = 910;  // 0.91 kg = 910 g

      const SLACKER_COSTO_TOTAL = 590;    // MXN
      const SLACKER_PESO_TOTAL_G = 490;   // g

      // Otros materiales (los dejo igual que tu versión original)
      const COSTO_ULTRACAL_KG = 36.08;
      const COSTO_GLATZAN_ML = 3.16;

      const ULTRACAL_CANTIDAD_KG = 1.5;
      const GLATZAN_CANTIDAD_ML = 5.0;

      const MARGEN_GANANCIA = 0.40;

      // Costo por gramo
      const COSTO_SILICONA_G = SILICONA_COSTO_TOTAL / SILICONA_PESO_TOTAL_G;
      const COSTO_SLACKER_G = SLACKER_COSTO_TOTAL / SLACKER_PESO_TOTAL_G;

      // Inputs
      const siliconaUsadaG = parseFloat(document.getElementById("silicona").value);
      const slackerUsadoG = parseFloat(document.getElementById("slacker").value);
      const resultado = document.getElementById("resultado");

      // Validación
      const siliconaValida = !isNaN(siliconaUsadaG) && siliconaUsadaG >= 0;
      const slackerValido = !isNaN(slackerUsadoG) && slackerUsadoG >= 0;

      if (!siliconaValida || !slackerValido || (siliconaUsadaG === 0 && slackerUsadoG === 0)) {
        resultado.textContent = "⚠️ Ingresa valores válidos (en gramos). Al menos uno debe ser mayor a 0.";
        return;
      }

      // Costos
      const costoSilicona = siliconaUsadaG * COSTO_SILICONA_G;
      const costoSlacker = slackerUsadoG * COSTO_SLACKER_G;

      const costoUltracal = ULTRACAL_CANTIDAD_KG * COSTO_ULTRACAL_KG;
      const costoGlatzan = GLATZAN_CANTIDAD_ML * COSTO_GLATZAN_ML;

      const costoTotal = costoSilicona + costoSlacker + costoUltracal + costoGlatzan;
      const precioFinal = costoTotal * (1 + MARGEN_GANANCIA);

      // Helper formato moneda
      const mxn = (n) => n.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });

      resultado.innerHTML = `
<b>Materiales utilizados:</b>
Silicona A/B: ${siliconaUsadaG.toFixed(2)} g  (≈ ${mxn(costoSilicona)})
Slacker: ${slackerUsadoG.toFixed(2)} g  (≈ ${mxn(costoSlacker)})
Ultracal (Molde): ${ULTRACAL_CANTIDAD_KG.toFixed(1)} kg  (≈ ${mxn(costoUltracal)})
Glatzan (Unidad): ${GLATZAN_CANTIDAD_ML.toFixed(1)} ml  (≈ ${mxn(costoGlatzan)})

<b>❌ Precio inicial (costo real de materiales):</b> ${mxn(costoTotal)}
🚨 Vender a este precio o menos resultará en una pérdida neta de su tiempo y esfuerzo. No acepte menos de lo que merece.

<b>✅ Precio sugerido:</b>
Margen aplicado: ${(MARGEN_GANANCIA * 100).toFixed(0)}%
💰 <b>Precio final sugerido:</b> ${mxn(precioFinal)}

<b>Referencia de costos por gramo:</b>
Silicona: ${mxn(COSTO_SILICONA_G)} / g
Slacker: ${mxn(COSTO_SLACKER_G)} / g
      `;
    }

    // Enter para calcular
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calcularCosto();
    });
  </script>
</body>
</html>
